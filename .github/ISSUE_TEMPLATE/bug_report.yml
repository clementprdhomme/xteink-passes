name: Bug report
description: Something in the app doesn't work as it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. If a code is drawn but a scanner can't read it, use the
        **A code doesn't scan** form instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a pass
        2. …
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - X4 Pro
        - X4 Classic
        - Studio preview
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: In the device's settings
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: On the About screen of the app (? button on the home screen)
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language of the device
      placeholder: English

  - type: dropdown
    id: format
    attributes:
      label: Format of the pass, if the problem is about one
      options:
        - Not about a pass
        - QR code
        - Aztec
        - Code 128
        - ITF
        - PDF417

  - type: upload
    id: photos
    attributes:
      label: Photos or videos
      description: A photo of the screen helps a lot. Don't share a pass with personal data.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.mp4,.mov"
